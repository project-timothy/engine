# The agent lane's egress proxy (issue #359; compose.lane.yaml).
#
# The lane container sits on an internal network with no route out; this
# proxy is its only door, and it opens for three hosts: GitHub (the clone's
# remote and the PR API) and the Anthropic API (the Claude Code session).
# Everything else is refused with a 403 and logged; the wrapper copies the
# log out of the proxy container and keeps it beside the night's transcript. A host the shadow week
# shows the session genuinely needs is added here by a reviewed PR, never
# opened by a wildcard.

http_port 3128

acl lane_allowed dstdomain github.com api.github.com api.anthropic.com
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow lane_allowed
http_access deny all

# One line per request, allowed or refused (TCP_DENIED/403). A file, not
# stdout: squid drops to its own user before it opens the log, and that user
# cannot open the container's stdout (found on the first run, 2026-10-07).
access_log stdio:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
cache deny all
coredump_dir /tmp
pid_filename none
shutdown_lifetime 1 seconds
via off
forwarded_for delete
