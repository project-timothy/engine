# The 2026 federal tax figures (board chunk c36). One file a year: each
# November the next year's file is one pull request that a person reads
# against the IRS's own release.
#
# Every figure carries four things: its value, the source it came from (a
# key under [sources]), where in that source (its address), and the day
# someone read it there (confirmed). tests/unit/test_tax_tables.py fails the
# build on a figure missing any of them.
#
# Money is in dollars as a string ("16100" or "192979.25"); a rate is a
# decimal string ("0.124"). A bracket row is [up to, rate, the printed base
# amount]; the top row's "up to" is "" (no ceiling).

year = "2026"

[sources]
rp-2025-32 = { title = "IRS Revenue Procedure 2025-32", url = "https://www.irs.gov/pub/irs-drop/rp-25-32.pdf" }
schedule-se = { title = "2026 Schedule SE (Form 1040), Self-Employment Tax", url = "https://www.irs.gov/pub/irs-pdf/f1040sse.pdf" }
i-schedule-se = { title = "Instructions for Schedule SE (Form 1040) (2026)", url = "https://www.irs.gov/pub/irs-pdf/i1040sse.pdf" }
form-1040-es = { title = "2026 Form 1040-ES, Estimated Tax for Individuals", url = "https://www.irs.gov/pub/irs-pdf/f1040es.pdf" }
i-form-2555 = { title = "Instructions for Form 2555 (2026), Foreign Earned Income", url = "https://www.irs.gov/pub/irs-pdf/i2555.pdf" }
notice-2026-25 = { title = "IRS Notice 2026-25, foreign housing limits for 2026", url = "https://www.irs.gov/pub/irs-drop/n-26-25.pdf" }
mileage = { title = "IRS standard mileage rates (IR-2025-128 and IR-2026-29)", url = "https://www.irs.gov/tax-professionals/standard-mileage-rates" }
form-8995 = { title = "Form 8995 (2025), Qualified Business Income Deduction Simplified Computation; the 20% is set by law and not indexed", url = "https://www.irs.gov/pub/irs-pdf/f8995.pdf" }
i-form-1099-nec = { title = "Instructions for Forms 1099-MISC and 1099-NEC (Rev. December 2026)", url = "https://www.irs.gov/pub/irs-pdf/i1099mec.pdf" }

