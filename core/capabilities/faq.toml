[[entry]]
id = "dates"
ask = "Will Tim remind me about my visa?"
answer = "Yes. Tim keeps the dates that matter, like filings, renewals, passports and visas, and reminds you weeks ahead."
try = "What's coming due this month?"
covers = ["deadlines"]
