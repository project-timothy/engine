[[entry]]
id = "did-it-run"
ask = "Did Tim do its morning work?"
answer = "Ask. Tim says whether this morning's work ran and how it went, and where closing the month stands."
try = "Where does closing September stand?"
covers = ["recent_runs", "close_status"]
live = "2026-10-09"

[[entry]]
id = "rules-after"
ask = "Does Tim check my month against our ministry's rules?"
answer = "Yes, once someone at your ministry has said yes to each rule. When your month goes to your reviewer, anything over a rule is listed at the top of the month, in the rule's own words, with the handbook and page it came from: a meal over the meal limit, a month over a newsletter cap, a bank line with no receipt where your handbook needs one. It doesn't stop the month; it tells your reviewer what to look at. A rule that asks for Face ID makes the yes take Face ID."
try = "Walk me through October. Anything over our rules?"
covers = ["month_report"]
live = "2026-10-14"

[[entry]]
id = "rules-before"
ask = "Can I ask Tim whether something is allowed before I buy it?"
answer = "Yes. Tell Tim what it is and about how much, and Tim reads your ministry's own rules: what applies at that amount, in the rule's words, with the handbook and page. Over a line, Tim says who needs to OK it first. Under every line, Tim says nothing stands in the way and reminds you of the rule that covers it. It's advice; nothing is decided or held. Tim answers only from rules someone at your ministry has said yes to."
try = "Can I buy a $1,400 projector for the school?"
covers = ["ask_the_rules"]
live = "2026-10-14"
