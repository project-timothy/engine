[[entry]]
id = "approve"
ask = "How do I approve someone's month?"
answer = "Ask what's waiting on you, then say yes or no in your own words. Under your ministry's dollar line, your word decides it. Over it, Tim shows a button; tap it and confirm with Face ID or your fingerprint, and it's done."
try = "Approve Ruth's September report."
covers = ["waiting_cards", "decide_card"]
live = "2026-10-11"

[[entry]]
id = "no-ai-month"
ask = "I don't use an AI. How do I see a month?"
answer = "Open the link in the email that says a month is ready. Your Face ID or fingerprint opens it, every time, and shows the receipts, drives and bank lines, the total, and where it stands. If the month is waiting on your yes, there's an Approve button. The link works for 7 days, and the next email brings a fresh one."
covers = ["month_report"]
live = "2026-10-14"

[[entry]]
id = "why-face-id"
ask = "Why does Tim sometimes ask for Face ID?"
answer = "Your ministry sets a dollar line. At or under it, saying yes to your AI is enough. Over it, Face ID proves it was you who said it, not someone else on your account."
covers = ["decide_card"]
live = "2026-10-11"

[[entry]]
id = "paid-back"
ask = "Have I been paid back?"
answer = "Ask Tim. Each report shows its total and where it stands: waiting for a yes, approved, or paid back."
try = "Have I been paid back for August?"
covers = ["expense_reports"]
